services:

  postgres:
    image: postgres:16-alpine
    container_name: siarc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siarc}
      POSTGRES_USER: ${POSTGRES_USER:-siarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siarc_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - siarc_sandbox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siarc} -d ${POSTGRES_DB:-siarc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: siarc-n8n-sandbox
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Bahia
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-troque_esta_chave_em_producao_32_ch}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
      - ./workflows:/workflows
    networks:
      - siarc_sandbox
  siarc-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siarc-api-sandbox
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://siarc:siarc_dev_password@postgres:5432/siarc}
      - SIARC_SANITIZER_ENABLED=${SIARC_SANITIZER_ENABLED:-1}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    networks:
      - siarc_sandbox
      - rt-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  siarc_sandbox:
    driver: bridge
  rt-network:
    external: true
volumes:
  n8n_data:
  postgres_data:
